name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk HunterPrey.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HunterPrey-apk
          path: HunterPrey.apk

      - name: Publish to Releases (download link for your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: HunterPrey.apk
        continue-on-error: true
