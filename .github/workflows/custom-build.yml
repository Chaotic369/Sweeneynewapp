name: Custom Build

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: false
        default: "My App"
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.inputs.app_name || 'My App' }}
      APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Patch app name and version
        run: |
          python3 - <<'PY'
          import os, re
          from xml.sax.saxutils import escape

          name = os.environ["APP_NAME"]
          version = os.environ["APP_VERSION"].strip()

          parts = re.findall(r"\d+", version)[:3]
          while len(parts) < 3:
              parts.append("0")
          major, minor, patch = (int(p) for p in parts)
          version_code = major * 10000 + minor * 100 + patch
          if version_code < 1:
              version_code = 1

          # ---- AndroidManifest: android:label ----
          manifest = "app/src/main/AndroidManifest.xml"
          with open(manifest, "r", encoding="utf-8") as f:
              m = f.read()
          safe_name = escape(name, {'"': "&quot;"})
          m, n = re.subn(r'android:label="[^"]*"', 'android:label="%s"' % safe_name, m, count=1)
          if n == 0:
              m = re.sub(r"<application", '<application android:label="%s"' % safe_name, m, count=1)
          with open(manifest, "w", encoding="utf-8") as f:
              f.write(m)

          # ---- Gradle: versionName / versionCode ----
          gradle_file = None
          for cand in ("app/build.gradle.kts", "app/build.gradle"):
              if os.path.exists(cand):
                  gradle_file = cand
                  break
          if gradle_file is None:
              raise SystemExit("No app/build.gradle.kts or app/build.gradle found")

          with open(gradle_file, "r", encoding="utf-8") as f:
              g = f.read()
          kts = gradle_file.endswith(".kts")
          vn = 'versionName = "%s"' % version if kts else "versionName '%s'" % version
          vc = "versionCode = %d" % version_code if kts else "versionCode %d" % version_code

          g, n1 = re.subn(r'versionName\s*=?\s*["\'][^"\']*["\']', vn, g, count=1)
          g, n2 = re.subn(r'versionCode\s*=?\s*\d+', vc, g, count=1)
          if n1 == 0 or n2 == 0:
              g, _ = re.subn(r'(defaultConfig\s*\{)', r'\1\n        %s\n        %s' % (vc, vn), g, count=1)
          with open(gradle_file, "w", encoding="utf-8") as f:
              f.write(g)

          print("Patched:", name, version, version_code, "in", gradle_file)
          PY

      - name: Inject launcher icon (if build-icon.png exists)
        run: |
          if [ -f build-icon.png ]; then
            pip install --quiet pillow
            python3 - <<'PY'
          import os
          from PIL import Image

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          src = Image.open("build-icon.png").convert("RGBA")
          for density, px in sizes.items():
              d = "app/src/main/res/mipmap-%s" % density
              os.makedirs(d, exist_ok=True)
              img = src.resize((px, px), Image.LANCZOS)
              img.save(os.path.join(d, "ic_launcher.png"))
              img.save(os.path.join(d, "ic_launcher_round.png"))

          # adaptive-icon XMLs would override the PNGs on Android 8+, so remove them
          for f in ("ic_launcher.xml", "ic_launcher_round.xml"):
              for sub in ("mipmap-anydpi-v26", "mipmap-anydpi"):
                  p = os.path.join("app/src/main/res", sub, f)
                  if os.path.exists(p):
                      os.remove(p)
          print("Icon injected")
          PY
          else
            echo "build-icon.png not found, keeping existing icon"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name || 'My App' }}
          path: app/build/outputs/apk/debug/app-debug.apk